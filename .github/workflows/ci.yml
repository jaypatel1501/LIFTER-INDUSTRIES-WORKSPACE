name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp_local_only@localhost:5432/erp?schema=public
      DIRECT_URL: postgresql://erp:erp_local_only@localhost:5432/erp?schema=public
      AUTH_SECRET: ci-test-secret-with-more-than-thirty-two-characters
      AUTH_URL: https://erp.example.test
      NEXT_PUBLIC_APP_URL: https://erp.example.test
      NEXT_PUBLIC_APP_NAME: ERP System
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
