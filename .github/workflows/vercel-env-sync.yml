name: Vercel Environment Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-env-sync.yml"
      - ".github/vercel-env-sync.json"
      - ".env.example"
  workflow_dispatch:

jobs:
  sync-production-env:
    name: Sync production environment variables to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ vars.AUTH_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      SMS_PROVIDER: ${{ vars.SMS_PROVIDER }}
      SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
      SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
      SMS_API_URL: ${{ vars.SMS_API_URL }}
      GST_API_BASE_URL: ${{ vars.GST_API_BASE_URL }}
      GST_API_CLIENT_ID: ${{ vars.GST_API_CLIENT_ID }}
      GST_API_CLIENT_SECRET: ${{ secrets.GST_API_CLIENT_SECRET }}
      EINVOICE_API_BASE_URL: ${{ vars.EINVOICE_API_BASE_URL }}
      EINVOICE_API_CLIENT_ID: ${{ vars.EINVOICE_API_CLIENT_ID }}
      EINVOICE_API_CLIENT_SECRET: ${{ secrets.EINVOICE_API_CLIENT_SECRET }}
      EWAYBILL_API_BASE_URL: ${{ vars.EWAYBILL_API_BASE_URL }}
      EWAYBILL_API_CLIENT_ID: ${{ vars.EWAYBILL_API_CLIENT_ID }}
      EWAYBILL_API_CLIENT_SECRET: ${{ secrets.EWAYBILL_API_CLIENT_SECRET }}
      WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
      SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.github/vercel-env-sync.json', 'utf8'));
          const requiredEntries = [
            ...config.requiredSecrets,
            ...config.requiredVars,
          ];
          const missing = requiredEntries.filter((key) => {
            const value = process.env[key];
            return value === undefined || value === '';
          });
          if (missing.length > 0) {
            const name = missing[0];
            console.error(`Missing required GitHub Actions secret or variable: ${name}`);
            process.exit(1);
          }
          for (const key of [...config.requiredSecrets, ...config.optionalSecrets]) {
            if (process.env[key] !== undefined && process.env[key] !== '') {
              console.log(`Configured: ${key}`);
            }
          }
          NODE

      - name: Push configured variables to Vercel Production
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('.github/vercel-env-sync.json', 'utf8'));
          const projectId = process.env.VERCEL_PROJECT_ID;
          const orgId = process.env.VERCEL_ORG_ID;
          const token = process.env.VERCEL_TOKEN;
          const apiBase = `https://api.vercel.com/v10/projects/${projectId}/env`;
          const headers = {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          };

          function shouldInclude(key) {
            const value = process.env[key];
            return value !== undefined && value !== '';
          }

          const valuesToSync = {};
          for (const key of [...config.requiredSecrets, ...config.requiredVars, ...config.optionalSecrets, ...config.optionalVars]) {
            if (shouldInclude(key)) {
              valuesToSync[key] = process.env[key];
            }
          }

          if (!projectId || !orgId || !token) {
            throw new Error('Missing required Vercel authentication variables.');
          }

          async function request(path, options = {}) {
            const response = await fetch(`${path}${path.includes('?') ? '&' : '?'}teamId=${encodeURIComponent(orgId)}`, {
              ...options,
              headers: {
                ...headers,
                ...(options.headers || {}),
              },
            });
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`Vercel API error (${response.status}): ${text.slice(0, 400)}`);
            }
            const text = await response.text();
            return text ? JSON.parse(text) : null;
          }

          const existing = await request(apiBase, { method: 'GET' });
          const environments = Array.isArray(existing?.envs) ? existing.envs : [];
          const toDelete = [];

          for (const entry of environments) {
            if (entry && entry.key && entry.target && entry.target.includes('production')) {
              if (Object.prototype.hasOwnProperty.call(valuesToSync, entry.key)) {
                toDelete.push(entry.id);
              }
            }
          }

          for (const envId of toDelete) {
            await request(`${apiBase}/${encodeURIComponent(envId)}`, { method: 'DELETE' });
          }

          for (const [key, value] of Object.entries(valuesToSync)) {
            const isPublic = key.startsWith('NEXT_PUBLIC_') || key.startsWith('AUTH_URL') || key === 'NEXT_PUBLIC_APP_URL' || key === 'NEXT_PUBLIC_APP_NAME';
            const payload = {
              key,
              value,
              type: isPublic ? 'plain' : 'encrypted',
              target: ['production'],
            };
            await request(apiBase, {
              method: 'POST',
              body: JSON.stringify(payload),
            });
          }

          console.log(`Synced ${Object.keys(valuesToSync).length} Vercel production variables without exposing any secret values.`);
          NODE
